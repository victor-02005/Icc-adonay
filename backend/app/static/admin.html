<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Panel | ICC Adonay</title>
<style>
:root{--n:#152B40;--g:#D9B875;--w:#F5F3EE;--i:#263238}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--w);color:var(--i);line-height:1.5}
header{background:var(--n);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--g)}
header b{font-family:Georgia,serif}nav{display:flex;flex-wrap:wrap;gap:.3rem;padding:.6rem 1rem;background:#fff;border-bottom:1px solid #ddd}
nav button,.b{background:var(--n);color:#fff;border:0;border-radius:8px;padding:.5rem .9rem;cursor:pointer;font-size:.95rem}
nav button.on{background:var(--g);color:var(--n);font-weight:bold}.b.s{background:#fff;color:var(--n);border:1px solid var(--n)}.b.r{background:#b3261e}
main{max-width:900px;margin:auto;padding:1rem}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:1rem;margin:.7rem 0}
label{display:block;font-weight:bold;margin:.7rem 0 .2rem;font-size:.9rem}input,select,textarea{width:100%;padding:.55rem;border:1px solid #bbb;border-radius:8px;font:inherit}
input[type=checkbox]{width:auto}textarea{min-height:90px}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tag{background:var(--g);color:var(--n);border-radius:99px;padding:.1rem .6rem;font-size:.75rem;font-weight:bold}.err{color:#b3261e;font-weight:bold}.ok{color:#1b6e3c;font-weight:bold}small{color:#667}
</style></head><body>
<header><b>ICC Adonay · Panel</b><span id="who"></span></header>
<nav id="nav" hidden></nav>
<main id="app"></main>
<script src="/admin.js"></script>
</body></html>
